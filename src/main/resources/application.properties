# ---------------------------------------------------------------------------
# Mail (Gmail SMTP)
# Secrets are read from environment variables. Never commit real credentials.
# Gmail requires a 16-character App Password (not your account password).
# ---------------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_TIMEOUT_MS:5000}

# ---------------------------------------------------------------------------
# OTP behaviour
# ---------------------------------------------------------------------------
otp.length=6
otp.ttl=5m
otp.max-attempts=3
otp.resend-cooldown=1m
otp.cleanup-interval=60000
otp.from=${MAIL_FROM:no-reply@example.com}
otp.subject=Your verification code

# Do not advertise the sender address on failed deliveries.
spring.mail.properties.mail.smtp.sendpartial=false

springdoc.swagger-ui.path=/swagger-ui.html
